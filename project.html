<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKS Group | مشروع</title>
<meta name="theme-color" content="#161314">
<link rel="icon" href="img/brand/icon-white.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Archivo:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="hdr"></header>
<main class="wrap" id="main" style="padding-bottom:80px"></main>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Drawings viewer">
  <div class="v-top">
    <div style="display:flex;align-items:center;gap:16px;min-width:0">
      <img src="img/brand/icon-white.png" alt="MKS" style="height:30px;width:auto">
      <div class="ttl"><small id="vProj"></small><b id="vTitle"></b></div>
    </div>
    <div class="v-ctl">
      <span class="lat" id="vCount" dir="ltr" style="color:var(--mut);padding:0 8px"></span>
      <button class="ib" type="button" id="vOut" aria-label="Zoom out"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button>
      <span class="lat" id="vZoom" style="min-width:48px;text-align:center;color:var(--mut);font-size:14px">100%</span>
      <button class="ib" type="button" id="vIn" aria-label="Zoom in"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="ib" type="button" id="vClose" aria-label="Close" style="margin-inline-start:8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
  <div class="v-stage" id="vStage">
    <button class="ib v-nav v-prev" type="button" id="vPrev" aria-label="Previous"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
    <img id="vImg" alt="" draggable="false">
    <button class="ib v-nav v-next" type="button" id="vNext" aria-label="Next"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button>
  </div>
  <div class="v-bot">
    <div class="v-thumbs" id="vThumbs"></div>
    <div class="v-cta"><span data-i="view_only">View only — need the full set?</span><a class="btn btn-gold" id="vWa" style="padding:11px 18px;font-size:15px" data-i="wa_short">WhatsApp us</a></div>
  </div>
</div>

<footer id="ftr"></footer>

<script>window.MKS_PAGE = { page: 'project', project: new URLSearchParams(location.search).get('id') };</script>
<script src="js/data.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/common.js"></script>
<script src="js/project.js"></script>
<script type="module" src="js/track.js"></script>
</body>
</html>
