<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MKS Group | كل مراحل مشروعك… برؤية واحدة.</title>
<meta name="description" content="MKS Group — كل مراحل مشروعك… برؤية واحدة. تصميم معماري وداخلي، حلول هندسية، تنفيذ وإنشاء. Every Stage of Your Project. One Vision. Engineering Consultancy & General Contracting, Cairo.">
<meta property="og:title" content="MKS Group — كل مراحل مشروعك… برؤية واحدة. | Every Stage of Your Project. One Vision.">
<meta property="og:description" content="التصميم المعماري والداخلي • الحلول الهندسية • التنفيذ والإنشاء">
<meta property="og:image" content="img/p/kh-05.jpg">
<meta name="theme-color" content="#161314">
<link rel="icon" href="img/brand/icon-white.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Archivo:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="hdr"></header>

<section class="hero" id="top">
  <div class="hero-bg" id="heroBg"><img id="heroImg" alt=""></div>
  <div class="wrap">
    <div class="hero-in">
      <div class="hero-tag fu"><i></i><span class="eyebrow" style="margin:0" data-i="hero_tag"></span></div>
      <h1 class="fu d1" data-i="hero_h1"></h1>
      <p class="fu d2" data-i="hero_p"></p>
      <div class="btns fu d3">
        <a class="btn btn-gold" href="#work" data-i="see_work"></a>
        <a class="btn btn-line" id="heroWa" href="#contact" data-i="wa_us"></a>
      </div>
    </div>
  </div>
</section>

<section class="stats" aria-label="Stats"><div class="wrap"><div class="stats-in fu d4" id="stats"></div></div></section>

<section class="sec" id="services"><div class="wrap">
  <div class="eyebrow rv">OUR SERVICES</div>
  <h2 class="h2 rv" data-i="services"></h2>
  <div class="grid3" id="svcs"></div>
</div></section>

<section class="sec" style="padding-top:80px" aria-label="Featured"><div class="wrap"><div class="feat rv" id="feat"></div></div></section>

<section class="sec process" id="process" style="margin-top:80px;padding:96px 0"><div class="wrap">
  <div class="eyebrow rv">OUR PROCESS</div>
  <h2 class="h2 rv" data-i="process" style="margin-bottom:48px"></h2>
  <div class="steps">
    <div class="step rv"><b>01</b><h3 data-i="p1_t"></h3><p data-i="p1_p"></p></div>
    <div class="step rv" style="transition-delay:.1s"><b>02</b><h3 data-i="p2_t"></h3><p data-i="p2_p"></p></div>
    <div class="step rv" style="transition-delay:.2s"><b>03</b><h3 data-i="p3_t"></h3><p data-i="p3_p"></p></div>
    <div class="step rv" style="transition-delay:.3s"><b>04</b><h3 data-i="p4_t"></h3><p data-i="p4_p"></p></div>
  </div>
</div></section>

<section class="sec" id="work" style="padding:96px 0"><div class="wrap">
  <div class="work-hd rv">
    <div><div class="eyebrow">PORTFOLIO</div><h2 data-i="work" style="font-size:42px"></h2></div>
    <div class="filters" id="filters" role="group" aria-label="Filter"></div>
  </div>
  <div class="pgrid" id="pgrid"></div>
</div></section>

<section id="about"><div class="wrap">
  <div class="about rv">
    <div style="flex:1 1 300px"><div class="eyebrow">ABOUT US</div><h2 data-i="about" style="font-size:42px"></h2></div>
    <div style="flex:2 1 520px"><p data-i="about_p1"></p><p data-i="about_p2"></p><p data-i="about_p3"></p></div>
  </div>
</div></section>

<section class="sec" id="contact" style="padding:72px 0 40px"><div class="wrap">
  <div class="contact rv">
    <div style="flex:1 1 380px">
      <h2 data-i="contact_h"></h2>
      <p data-i="contact_p" style="margin:0 0 32px;font-size:17px;line-height:1.8;color:var(--mut)"></p>
      <div class="info">
        <div><span data-i="i_addr"></span><span data-i="addr"></span></div>
        <div><span data-i="i_phone"></span><a dir="ltr" id="phoneLink"></a></div>
        <div><span data-i="i_web"></span><span dir="ltr">www.mksgroupco.com</span></div>
      </div>
    </div>
    <form class="form" id="form" novalidate>
      <label><span data-i="f_name"></span><input name="name" autocomplete="name" required></label>
      <label><span data-i="f_mobile"></span><input name="mobile" type="tel" autocomplete="tel" dir="ltr" required></label>
      <label><span data-i="f_service"></span><select name="service"><option data-i="c_3d"></option><option data-i="c_dwg"></option><option data-i="c_site"></option></select></label>
      <label><span data-i="f_msg"></span><textarea name="msg" rows="3"></textarea></label>
      <button class="btn btn-gold" type="submit" data-i="f_send"></button>
      <div class="ok" id="formMsg" role="status"></div>
    </form>
  </div>
  <div class="loc rv" id="location">
    <iframe id="map" title="MKS Group location" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    <div class="bd">
      <div class="eyebrow" style="margin:0">OUR LOCATION</div>
      <h3 data-i="loc_h" style="font-size:28px"></h3>
      <p data-i="loc_p"></p>
      <a class="btn btn-gold" id="mapsLink" target="_blank" rel="noopener" data-i="loc_open" style="align-self:flex-start;margin-top:8px"></a>
    </div>
  </div>
</div></section>

<footer id="ftr"></footer>

<script>window.MKS_PAGE = { page: 'home', project: null };</script>
<script src="js/data.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/common.js"></script>
<script src="js/home.js"></script>
<script type="module" src="js/track.js"></script>
</body>
</html>
